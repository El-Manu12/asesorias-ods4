<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AulaConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card card-custom p-4 shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none fs-3">🎓</a>
            <h4 class="fw-bold mt-2">Iniciar Sesión</h4>
            <p class="text-muted small">Accede a tu cuenta de AulaConnect</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Correo Electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="tu_correo@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
        </form>

        <form id="formCodigoLogin" hidden>
            <div class="text-center mb-3"><div class="verification-icon">✉</div><h5 class="fw-bold mb-1">Confirma tu correo</h5><p class="text-muted small mb-0" id="destinoCodigo">Enviamos un código de seis dígitos.</p></div>
            <label class="form-label small fw-semibold" for="codigoLogin">Código de verificación</label>
            <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" id="codigoLogin" class="form-control verification-code-input mb-3" placeholder="000000" required>
            <button type="submit" class="btn btn-primary w-100 mb-2">Confirmar e ingresar</button>
            <button type="button" id="volverLogin" class="btn btn-link w-100 text-decoration-none">Volver al inicio de sesión</button>
        </form>

        <div class="text-center small">
            <span class="text-muted">¿No tienes cuenta?</span> <a href="registro.html" class="text-decoration-none fw-semibold">Regístrate aquí</a>
        </div>
        <div id="bootstrapAdminLink" class="text-center small mt-3" hidden><a href="configurar-admin.html" class="text-decoration-none fw-semibold">Configurar el primer administrador</a></div>
    </div>

    <!-- MODAL MENSAJE GENERAL -->
    <div class="modal fade" id="modalMensaje" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow text-center p-4">
                <h5 class="fw-bold mb-2" id="msgTitulo">¡Aviso!</h5>
                <p class="text-muted small mb-3" id="msgCuerpo">Operación realizada.</p>
                <button type="button" class="btn btn-primary btn-sm w-100" data-bs-dismiss="modal">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Apuntamos correctamente a la API de Node.js
        const API_URL = 'http://localhost:3000/api';
        let challengeIdLogin = '';

        function mostrarMensaje(titulo, cuerpo) {
            document.getElementById('msgTitulo').textContent = titulo;
            document.getElementById('msgCuerpo').textContent = cuerpo;
            new bootstrap.Modal(document.getElementById('modalMensaje')).show();
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {
                // Petición limpia directa al endpoint de Node.js
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });
                
                const data = await res.json();

                if (data.success && data.verificacion_requerida) {
                    challengeIdLogin = data.challenge_id;
                    document.getElementById('destinoCodigo').textContent = `Enviamos el código a ${data.correo}. Caduca en 10 minutos.`;
                    document.getElementById('formLogin').hidden = true;
                    document.getElementById('formCodigoLogin').hidden = false;
                    document.getElementById('codigoLogin').focus();
                } else if (data.success) {
                    const usuarioRespuesta = data.usuario || data.user || (data.id ? data : null);
                    if (!usuarioRespuesta || !usuarioRespuesta.id || !data.token) {
                        mostrarMensaje('Servidor anterior', 'La contraseña es correcta, pero esta versión no creó una sesión verificada. Inicia AulaConnect desde el backend actualizado y vuelve a intentarlo.');
                        return;
                    }
                    const usuarioLimpio = { ...usuarioRespuesta };
                    delete usuarioLimpio.password;
                    localStorage.setItem('usuarioActual', JSON.stringify(usuarioLimpio));
                    localStorage.setItem('tokenSesion', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    mostrarMensaje(res.status === 503 ? 'No se pudo enviar el código' : 'Acceso Denegado', data.message || 'Credenciales incorrectas.');
                }
            } catch (err) {
                console.error("Error en login:", err);
                mostrarMensaje('Error', 'No se pudo conectar con el servidor de Node.js.');
            }
        });

        document.getElementById('formCodigoLogin').addEventListener('submit', async event => {
            event.preventDefault();
            try {
                const res = await fetch(`${API_URL}/verificar_login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ challenge_id: challengeIdLogin, codigo: document.getElementById('codigoLogin').value.trim() }) });
                const data = await res.json();
                if (!res.ok || !data.success) return mostrarMensaje('No se pudo verificar', data.message || 'Revisa el código e inténtalo de nuevo.');
                localStorage.setItem('usuarioActual', JSON.stringify(data.usuario));
                localStorage.setItem('tokenSesion', data.token);
                window.location.href = 'dashboard.html';
            } catch (error) { mostrarMensaje('Error', 'No fue posible comprobar el código. Revisa tu conexión.'); }
        });

        document.getElementById('volverLogin').addEventListener('click', () => {
            challengeIdLogin = '';
            document.getElementById('codigoLogin').value = '';
            document.getElementById('formCodigoLogin').hidden = true;
            document.getElementById('formLogin').hidden = false;
        });

        fetch(`${API_URL}/admin/setup/status`).then(res => res.json()).then(data => {
            document.getElementById('bootstrapAdminLink').hidden = !data.setup_required;
        }).catch(() => {});
    </script>
</body>
</html>
